
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Fireplace - Preview</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
        }

        body {
            background: #242424;
            font-family: Arial, sans-serif;
            overflow-x: hidden;
        }
        .wrapper {
            position: relative;
            margin: 20px auto;
        }
        .fireplace {
            position: absolute;
            top: 0;
            left: 0;

            width: 1672px;
            height: 975px;

            display: grid;

            grid-template-columns:
        320px 1032px 320px;

            grid-template-rows:
        250px 725px;

            transform-origin: top left;
        }

        iframe {
            display: block;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .left {
            grid-column: 1;
            grid-row: 1 / 3;
        }

        .top {
            grid-column: 2;
            grid-row: 1;
        }

        .right {
            grid-column: 3;
            grid-row: 1 / 3;
        }

        .publisher {
            grid-column: 2;
            grid-row: 2;
            background: #282828;
        }
    </style>

    <script>
        // Register before iframes are loaded.
        const readyFrames = new Set();
        let started = false;

        window.addEventListener("message", event => {
            if (
                event.origin !== location.origin ||
                event.data?.type !== "fireplace-ready"
            ) {
                return;
            }

            const frames = [
                ...document.querySelectorAll("iframe")
            ];

            const frame = frames.find(
                item => item.contentWindow === event.source
            );

            if (!frame) return;

            readyFrames.add(frame);

            if (
                started ||
                readyFrames.size !== 3
            ) {
                return;
            }

            started = true;

            const at = Date.now() + 150;

            frames.forEach(item => {
                item.contentWindow.postMessage(
                    {
                        type: "fireplace-start",
                        at
                    },
                    location.origin
                );
            });
        });
    </script>
</head>

<body>
<div class="wrapper" id="wrapper">

    <main class="fireplace" id="fireplace">

        <iframe  class="left"
                 src="left.html?preview=1"
                 title="Left advertisement" >
        </iframe>

        <iframe  class="top"
                 src="top.html?preview=1"
                 title="Top advertisement" >
        </iframe>

        <div class="publisher"
             aria-label="Publisher website" >
        </div>

        <iframe
                class="right"
                src="right.html?preview=1"
                title="Right advertisement"
        ></iframe>

    </main>
</div>

<script>
    const wrapper = document.getElementById(
        "wrapper"
    );

    const fireplace = document.getElementById(
        "fireplace"
    );

    // ?native=1 displays exact CSS dimensions.
    const native = new URLSearchParams(
        location.search
    ).has("native");

    function resizePreview() {
        const scale = native
            ? 1
            : Math.max(
                0.1,
                Math.min(
                    1,
                    (window.innerWidth - 40) / 1672
                )
            );

        fireplace.style.transform =
            `scale(${scale})`;

        wrapper.style.width =
            `${1672 * scale}px`;

        wrapper.style.height =
            `${975 * scale}px`;

        document.body.style.overflowX =
            native ? "auto" : "hidden";
    }

    window.addEventListener(
        "resize",
        resizePreview
    );

    resizePreview();
</script>
</body>
</html>
