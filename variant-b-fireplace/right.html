
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Fireplace - Right</title>

    <script>
        document.documentElement.classList.add("js");
    </script>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
<a class="ad ad--right"
   href="https://example.com/landing"
   target="_blank"
   rel="noopener noreferrer"
   aria-label="Bildet einen beruhigenden Schutzfilm. Jetzt entdecken"

>
    <img class="side-layer logo animated"
         src="assets/right/logo.png"
         alt=""

    >

    <img  class="side-layer panel animated"
          src="assets/box.png"
          alt=""

    >

    <img class="side-layer copy animated"
         src="assets/right/hl.png"
         alt=""

    >

    <span class="cta animated">
      <img  class="cta-art"
            src="assets/cta.png"
            alt="Jetzt entdecken"

      >
    </span>
</a>
</body>
</html>
